name: marketplace_app
description: Application mobile marketplace contrôlée pour électroménager, meubles, literie et décoration.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  signalr_netcore: ^1.1.4
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Image Handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0
  
  # Phone Calls
  url_launcher: ^6.2.1
  
  # Form Validation
  intl: ^0.18.1
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.5

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
